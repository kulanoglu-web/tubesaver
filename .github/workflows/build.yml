name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 8.9 wird direkt installiert, daher wird kein gradle-wrapper.jar benötigt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug-APK bauen
        # Die Build-Nummer zählt bei jedem GitHub-Lauf automatisch hoch und wird zur App-Version
        run: gradle :app:assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: ClearTube-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
